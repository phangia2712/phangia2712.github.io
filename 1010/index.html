<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoe's Birthday</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> -->
    <!-- Google Font-->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="outside">
        <div class="front">
          <p>Happy Birthday<br />10/10</p>
          <div class="cake">
            <div class="top-layer"></div>
            <div class="middle-layer"></div>
            <div class="bottom-layer"></div>
            <div class="candle"></div>
          </div>
        </div>
        <div class="back"></div>
      </div>
      <div class="inside">
        <p>Wishing you a very happy birthday filled with love and laughter<br />---<br />SHOULD SMILE MORE!<br>---<br />Em, <a href="https://shopeefood.vn/ho-chi-minh/tra-sua-tocotoco-232-nguyen-trong-tuyen" target="_blank">Order drinks here</a></p>
        <h1>&#127873;</h1>
      </div>
    </div>
    <div class="control-group">
      <button id="playPauseBtn" class="btn btn-success">Play Music</button>
      <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="1">
    </div>
    <script>
      let backgroundMusic = new Audio('niem-dau-chon-dau.mp3');
      let playPauseBtn = document.getElementById('playPauseBtn');
      let volumeControl = document.getElementById('volumeControl');


      backgroundMusic.loop = true;
      playPauseBtn.addEventListener('click', () => {
        if (backgroundMusic.paused) {
                backgroundMusic.play();
                playPauseBtn.textContent = 'Paused';
        } else {
            backgroundMusic.pause();
            playPauseBtn.textContent = 'Play Music';
        }
      });
      volumeControl.addEventListener('input', function() {
            backgroundMusic.volume = volumeControl.value;
      });
    </script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> -->
  </body>
</html>
